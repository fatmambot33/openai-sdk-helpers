[project]
name = "openai-sdk-helpers"
version = "0.8.1"
requires-python = ">=3.10"
readme = "README.md"
description = "Composable helpers for OpenAI SDK agents, prompts, and storage"
license = {text = "MIT"}
authors = [{name = "openai-sdk-helpers maintainers"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "jinja2",
    "pydantic>=2.7,<3",
    "typing_extensions>=4.15.0,<5",
    "python-dotenv",
    "tqdm",
    "openai>=2.45.0,<4.0.0",
    "openai-agents>=0.18.1,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pydocstyle",
    "pyright",
    "black",
    "black[jupyter]",
    "pytest-cov",
    "pytest",
    "pytest-asyncio",
    "langextract",
    "streamlit",
]
extract = ["langextract"]
ui = ["streamlit"]
all = [
    "langextract",
    "streamlit",
]

[project.scripts]
openai-helpers = "openai_sdk_helpers.cli:main"
openai-helpers-credentials = "openai_sdk_helpers.credential_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/openai_sdk_helpers"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_sdk_helpers"]

[tool.hatch.build.targets.sdist]
include = ["src/openai_sdk_helpers"]

[tool.black]
extend-exclude = "scripts/validate_ai_native_platform.py"

[tool.pyright]
extraPaths = ["src"]

[tool.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
