name: CI

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-type:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run docstring style checks
        run: pydocstyle src

      - name: Validate internal Markdown links
        run: python scripts/check_markdown_links.py

      - name: Format check with black
        run: black --check --diff .

      - name: Type check with pyright
        run: pyright src

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-fail-under=70

  install-profile:
    name: Install ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: core
            target: "."
          - profile: extract
            target: ".[extract]"
          - profile: ui
            target: ".[ui]"
          - profile: all
            target: ".[all]"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.target }}"
          python -m pip check

      - name: Validate package profile
        run: python scripts/validate_optional_install.py "${{ matrix.profile }}"

  installed-wheel:
    name: Installed wheel and examples
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir package-dist
          python -m twine check package-dist/*

      - name: Install the built wheel
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install package-dist/*.whl
          .venv-wheel/bin/python -m pip check

      - name: Verify installed package data and entry points
        run: |
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/python scripts/validate_installed_wheel.py
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/openai-helpers --help
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/openai-helpers-credentials --help

      - name: Execute supported examples
        run: |
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/python examples/supported_responses.py
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/python examples/supported_agents.py
          env -u OPENAI_API_KEY -u PYTHONPATH \
            .venv-wheel/bin/python examples/codex_plugin.py
