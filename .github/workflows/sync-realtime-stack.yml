name: Sync Realtime roadmap stack

on:
  push:
    branches: [agent/realtime-events]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge finalized lifecycle and resolve owned files
        run: |
          git fetch origin agent/realtime-session
          set +e
          git merge --no-ff --no-commit origin/agent/realtime-session
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "Conflicts:"
            echo "$conflicts"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                src/openai_sdk_helpers/mcp/*|tests/test_mcp_*)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                README.md|CHANGELOG.md|docs/capabilities.md|docs/public-api.md|docs/mcp.md|docs/mcp-policy.md)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/sync-realtime-stack.yml
      - name: Commit synchronized roadmap stack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize finalized MCP and Realtime roadmap stack'
          git push origin HEAD:agent/realtime-events
