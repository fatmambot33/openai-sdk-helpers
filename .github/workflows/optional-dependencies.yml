name: Optional dependency installs

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  install-profile:
    name: Install ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            target: "."
          - profile: extract
            target: ".[extract]"
          - profile: ui
            target: ".[ui]"
          - profile: mcp
            target: ".[mcp]"
          - profile: all
            target: ".[all]"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package profile
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.target }}"
          python -m pip check

      - name: Validate package profile
        run: python scripts/validate_optional_install.py "${{ matrix.profile }}"
