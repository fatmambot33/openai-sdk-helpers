name: Finalize Realtime events roadmap

on:
  push:
    branches: [agent/realtime-events]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Finalize code and documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          processing = Path('src/openai_sdk_helpers/realtime/processing.py')
          text = processing.read_text()
          old = '''        coroutine = registry.execute(\n            call,\n            capture_errors=capture_errors,\n            operation_context=operation_context,\n        )\n'''
          new = '''        coroutine = registry.execute(\n            call,\n            capture_errors=capture_errors,\n            operation_context=None,\n        )\n'''
          assert old in text
          processing.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          anchor = '- [Realtime lifecycle](docs/realtime.md) — typed server-side session configuration and ownership\n'
          addition = '- [Realtime events and tools](docs/realtime-events.md) — ordered events, approvals, controls, and deterministic testing\n'
          assert anchor in text
          text = text.replace(anchor, anchor + addition, 1)
          old_scope = '''MCP, consolidated retrieval, and Realtime helpers are roadmap items, not current\npackage promises. Their issue order and release gates are tracked in\n[ROADMAP.md](ROADMAP.md).\n'''
          new_scope = '''Retrieval, MCP, and Realtime are preview surfaces on the stacked roadmap. They\nremain subject to their documented public-contract, security, compatibility, and\nrelease gates before a stable package release. See [ROADMAP.md](ROADMAP.md).\n'''
          assert old_scope in text
          readme.write_text(text.replace(old_scope, new_scope, 1))

          capabilities = Path('docs/capabilities.md')
          text = capabilities.read_text()
          search_row = '| Direct search and File Search | `openai_sdk_helpers.retrieval` | Wraps official vector-store search and builds official Responses/Agents File Search configuration | Preview | Core | Matching sync/async direct search plus local hosted-tool adapters | Raw search pages, result items, tool calls, citations, filters, request mappings, and official Agents tools remain accessible |\n'
          mcp_row = '| MCP integration | `openai_sdk_helpers.mcp` | Builds official hosted and Streamable HTTP transports with explicit filtering, approvals, caching, safe retries, and failure isolation | Preview | Core; opt-in import and configuration | Hosted construction, explicit async lifecycle, and local policy helpers | Raw official tools, servers, descriptors, calls, and exceptions remain accessible; no mutating retry is automatic |\n'
          assert search_row in text
          if mcp_row not in text:
              text = text.replace(search_row, search_row + mcp_row, 1)
          old_realtime = '| Realtime session lifecycle | `openai_sdk_helpers.realtime` | Builds or wraps the official Agents SDK Realtime runner and session with typed settings and explicit async lifecycle | Preview | Core; opt-in import and configuration | Explicit start, close, local timeout, and opt-in restart | Raw official runner and session remain accessible; no browser, audio-device, or hidden reconnect layer |\n'
          new_realtime = '| Realtime integration | `openai_sdk_helpers.realtime` | Wraps the official Agents SDK runner/session and normalizes common events while retaining raw SDK objects | Preview | Core; opt-in import and configuration | Explicit async lifecycle, ordered event/callback consumption, fail-closed tools, controls, and deterministic tests | Raw runner, session, event, call, result, and exception access; no browser, audio-device, hidden reconnect, or automatic execution layer |\n'
          assert old_realtime in text
          text = text.replace(old_realtime, new_realtime, 1)
          start = text.index('## Planned capabilities\n')
          end = text.index('Images and audio generation are not committed roadmap surfaces.')
          replacement = '''## Planned capabilities\n\nThe currently committed roadmap ends with the preview Realtime surface above.\nAdditional public capabilities require a new issue, product-principle review, and\nrelease target before implementation.\n\n'''
          text = text[:start] + replacement + text[end:]
          capabilities.write_text(text)

          public_api = Path('docs/public-api.md')
          text = public_api.read_text()
          anchor = '## Compatibility policy\n'
          section = '''## Focused Realtime submodule API\n\nThe intentional preview API exposed by `openai_sdk_helpers.realtime` includes:\n\n- typed runner and session configuration plus `ManagedRealtimeSession`;\n- `RealtimeEventEnvelope`, `RealtimeEventKind`, and ordered event consumers;\n- `RealtimeToolCall`, `RealtimeToolResult`, and `RealtimeToolRegistry`;\n- fail-closed approval, timeout, execution, and explicit submission helpers;\n- explicit message, audio-chunk, interruption, and cancellation helpers;\n- `InMemoryRealtimeSession` for deterministic network-free tests.\n\nEvery normalized event and tool call preserves its raw source object. The exact\nexport order is locked by `tests/test_realtime_public_api.py`.\n\n'''
          assert anchor in text
          public_api.write_text(text.replace(anchor, section + anchor, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          anchor = '## Unreleased\n\n'
          addition = (
              '- Added ordered Realtime event normalization and sequential callback consumption while preserving every raw SDK event.\n'
              '- Added fail-closed Realtime tool approval, explicit timeout and cancellation behavior, serialized result submission, controls, and a deterministic in-memory test session.\n'
              '- Added opt-in hosted and Streamable HTTP MCP transport helpers with explicit connection ownership and raw official SDK access.\n'
              '- Added MCP filtering, fail-closed approvals, bounded safe retries, cache invalidation, and per-server failure isolation without automatic mutating retries.\n'
          )
          assert anchor in text
          changelog.write_text(text.replace(anchor, anchor + addition, 1))
          PY
          python -m pip install --upgrade black
          black src/openai_sdk_helpers/mcp src/openai_sdk_helpers/realtime tests/test_mcp_policy.py tests/test_mcp_public_api.py tests/test_mcp_transport.py tests/test_realtime_events.py tests/test_realtime_public_api.py tests/test_realtime_session.py
          git rm .github/workflows/finalize-realtime-events.yml
      - name: Commit final roadmap tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Finalize Realtime events tools and roadmap documentation'
          git push origin HEAD:agent/realtime-events
