name: OpenAI SDK compatibility

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: openai-sdk-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        dependencies: [minimum, latest]
        exclude:
          - python: "3.11"
            dependencies: minimum
          - python: "3.12"
            dependencies: minimum

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build

      - name: Install minimum OpenAI SDK versions
        if: matrix.dependencies == 'minimum'
        run: |
          python -m pip install \
            "openai==2.45.0" \
            "openai-agents==0.18.1" \
            "pydantic==2.12.5"
          python -m pip install -e ".[dev]" --no-deps
          python -m pip install \
            jinja2 \
            "typing_extensions>=4.15.0,<5" \
            python-dotenv \
            langextract \
            "pandas<3" \
            streamlit \
            pytest \
            pytest-asyncio \
            pytest-cov

      - name: Install latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: python -m pip install -e ".[dev]"

      - name: Show resolved versions
        run: |
          python -c "import openai; print('openai', openai.__version__)"
          python -c "import importlib.metadata as m; print('openai-agents', m.version('openai-agents'))"
          python -c "import pydantic; print('pydantic', pydantic.__version__)"
          python --version

      - name: Run tests
        run: python -m pytest

      - name: Build distributions
        run: python -m build
