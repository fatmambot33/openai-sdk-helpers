name: Format retrieval lifecycle branch

on:
  push:
    branches: [agent/retrieval-lifecycle]

permissions:
  contents: write

jobs:
  black:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Format Python files
        run: |
          python -m pip install --upgrade black
          black .
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Apply canonical Black formatting'
          git push origin HEAD:agent/retrieval-lifecycle
