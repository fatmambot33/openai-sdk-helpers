name: Normalize Realtime timeout

on:
  push:
    branches: [agent/realtime-events]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Normalize timeout and verify Python 3.10
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/openai_sdk_helpers/realtime/processing.py')
          text = path.read_text()
          old = '''        try:\n            return await asyncio.wait_for(coroutine, timeout=timeout_seconds)\n        except TimeoutError as error:\n            if capture_errors:\n                return RealtimeToolResult(\n                    call_id=call.call_id,\n                    name=call.name,\n                    error=error,\n                    raw_call=call.raw,\n                )\n            raise\n'''
          new = '''        try:\n            return await asyncio.wait_for(coroutine, timeout=timeout_seconds)\n        except asyncio.TimeoutError as error:\n            normalized_error = TimeoutError(\n                f"Realtime tool {call.name!r} timed out after "\n                f"{timeout_seconds} seconds"\n            )\n            if capture_errors:\n                return RealtimeToolResult(\n                    call_id=call.call_id,\n                    name=call.name,\n                    error=normalized_error,\n                    raw_call=call.raw,\n                )\n            raise normalized_error from error\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          black src/openai_sdk_helpers/realtime/processing.py tests/test_realtime_events.py
          pyright src/openai_sdk_helpers/realtime
          pytest -q tests/test_realtime_events.py::test_tool_timeout_is_explicit_and_cancels_handler
          git rm .github/workflows/fix-realtime-timeout.yml
      - name: Commit normalized timeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Normalize Realtime timeout across Python versions'
          git push origin HEAD:agent/realtime-events
