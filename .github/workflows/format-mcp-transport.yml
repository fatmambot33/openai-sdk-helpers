name: Format MCP transport

on:
  push:
    branches: [agent/mcp-transport]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply canonical formatting
        run: |
          python -m pip install --upgrade black
          black src/openai_sdk_helpers/mcp/transport.py tests/test_mcp_transport.py tests/test_mcp_public_api.py
          git rm .github/workflows/format-mcp-transport.yml
      - name: Commit corrected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Apply canonical MCP transport formatting'
          git push origin HEAD:agent/mcp-transport
