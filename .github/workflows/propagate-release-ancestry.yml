name: Propagate synchronized release ancestry

on:
  push:
    branches: [agent/state-semantics]

permissions:
  contents: write

jobs:
  propagate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge parent ancestry through the roadmap stack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          combine_changelog() {
            python - "$1" "$2" <<'PY'
          from pathlib import Path
          import sys

          ours = Path(sys.argv[1]).read_text()
          source = Path(sys.argv[2]).read_text()
          heading = "## Unreleased\n"
          if heading not in ours or heading not in source:
              raise SystemExit("missing Unreleased changelog heading")
          prefix = ours.split(heading, 1)[0] + heading
          ours_after = ours.split(heading, 1)[1]
          source_after = source.split(heading, 1)[1]
          if "\n## " not in source_after:
              raise SystemExit("source changelog has no release history")
          ours_unreleased = ours_after.split("\n## ", 1)[0].strip()
          source_versions = "## " + source_after.split("\n## ", 1)[1].lstrip()
          parts = [prefix.rstrip(), ""]
          if ours_unreleased:
              parts.extend([ours_unreleased, ""])
          parts.append(source_versions.rstrip())
          Path("CHANGELOG.md").write_text("\n".join(parts) + "\n")
          PY
          }

          sync_branch() {
            source="$1"
            target="$2"
            echo "Synchronizing $source -> $target"
            git checkout -B "$source" "origin/$source"
            git checkout -B "$target" "origin/$target"
            git show "HEAD:CHANGELOG.md" > /tmp/changelog-ours
            git show "origin/$source:CHANGELOG.md" > /tmp/changelog-source
            set +e
            git merge --no-ff --no-commit "origin/$source"
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              echo "Conflicts:"
              echo "$conflicts"
              unexpected="$(printf '%s\n' "$conflicts" | grep -v '^CHANGELOG.md$' || true)"
              if [ -n "$unexpected" ]; then
                echo "Unexpected conflicts:" >&2
                echo "$unexpected" >&2
                exit 1
              fi
            fi
            combine_changelog /tmp/changelog-ours /tmp/changelog-source
            git add CHANGELOG.md
            test -z "$(git diff --name-only --diff-filter=U)"
            if [ "$target" = 'agent/state-semantics' ]; then
              git rm .github/workflows/propagate-release-ancestry.yml
            fi
            git commit -m "Synchronize $target with finalized parent ancestry"
            git push origin "HEAD:$target"
            git update-ref "refs/remotes/origin/$target" HEAD
          }

          sync_branch agent/operation-context agent/state-semantics
          sync_branch agent/state-semantics agent/retrieval-contract
          sync_branch agent/retrieval-contract agent/retrieval-lifecycle
          sync_branch agent/retrieval-lifecycle agent/file-search
          sync_branch agent/file-search agent/mcp-transport
          sync_branch agent/mcp-transport agent/mcp-policy
          sync_branch agent/mcp-policy agent/realtime-session
          sync_branch agent/realtime-session agent/realtime-events
