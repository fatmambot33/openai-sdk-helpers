name: Fix MCP approval edge

on:
  push:
    branches: [agent/mcp-policy]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fix fail-closed approval behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = Path('src/openai_sdk_helpers/mcp/policy.py')
          text = policy.read_text()
          old = '    if decision not in MCPApprovalDecision:\n'
          new = '    if not isinstance(decision, MCPApprovalDecision):\n'
          assert old in text
          policy.write_text(text.replace(old, new, 1))

          tests = Path('tests/test_mcp_policy.py')
          text = tests.read_text()
          anchor = '\n\n@pytest.mark.asyncio\nasync def test_safe_retry_requires_explicit_idempotence_and_policy() -> None:\n'
          addition = '''\n\n@pytest.mark.asyncio\nasync def test_invalid_approval_value_fails_closed() -> None:\n    policy = MCPToolPolicy(\n        allowed_tools=("write",),\n        approval_tools=("write",),\n    )\n    request = MCPApprovalRequest("docs", "write", {})\n\n    def invalid(_: MCPApprovalRequest) -> Any:\n        return "approve"\n\n    assert (\n        await request_approval(policy, request, invalid)\n        is MCPApprovalDecision.REJECT\n    )\n'''
          assert anchor in text
          tests.write_text(text.replace(anchor, addition + anchor, 1))
          PY
          python -m pip install --upgrade black
          black src/openai_sdk_helpers/mcp/policy.py tests/test_mcp_policy.py
          git rm .github/workflows/fix-mcp-approval.yml
      - name: Commit corrected policy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Fix fail-closed MCP approval validation'
          git push origin HEAD:agent/mcp-policy
