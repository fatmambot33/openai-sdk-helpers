name: AI-native platform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Request Codex review of current HEAD
        if: github.event_name == 'pull_request'
        uses: fatmambot33/ai-native-platform/actions/codex-review-gate@bab7925d367aeaaf7941d10e34e7fe1ed66b35d5
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
          request-only: "true"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5' 'PyYAML>=6,<7'
      - name: Validate the pinned AI-native contract and repository evidence
        run: python scripts/validate_ai_native_platform.py
      - name: Require Codex review of current HEAD
        if: github.event_name == 'pull_request'
        uses: fatmambot33/ai-native-platform/actions/codex-review-gate@bab7925d367aeaaf7941d10e34e7fe1ed66b35d5
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          head-repo: ${{ github.event.pull_request.head.repo.full_name }}
