version: 1
standard:
  repository: fatmambot33/ai-native-platform
  ref: 585484a227741a9eac78393e631b9d3794b85ec8
quality:
  typed: true
  tests: true
  docs: true
  examples: true
  compatibility: true
  security_scan: true
release:
  block_if_quality_fails: true
  block_if_plugin_invalid: true
agent:
  guarantees:
  - deterministic_tool_discovery
  - structured_outputs
  - issue_driven_improvement
  - ci_validated_changes
  - governed_autonomy
self_improvement:
  enabled: true
  github:
    issues: true
  autonomous:
    discover_improvements: true
    create_issues: true
    generate_pr: true
    run_ci: true
  governance:
    human_approval:
      breaking_changes: true
      security_changes: true
      credential_changes: true
      public_api_changes: true
      permission_expansion: true
      release_changes: true
product:
  name: openai-sdk-helpers
  profile: agent-tool
  ai_native: true
  description: Typed OpenAI SDK helpers with CLI and Codex plugin surfaces for agent
    workflows.
plugin:
  enabled: true
  codex:
    supported: true
    marketplace: true
  discovery:
    entry_points: true
    manifest: true
    capabilities: true
  credentials:
    required: true
    local_only: true
    env_file: .env
    env_example: plugins/openai-sdk-helpers/.env.example
    setup_command: openai-helpers-credentials configure
    validation_command: openai-helpers-credentials doctor
    required_variables:
    - OPENAI_API_KEY
    policy:
      never_store_remote: true
      never_commit: true
      never_echo: true
interfaces:
  sdk: true
  cli: true
  plugin: true
  json_schema: true
  mcp: false
  openapi: false
evidence:
  mode: repository
  paths:
    readme: README.md
    tests: tests
    agent_instructions: AGENTS.md
    typing: pyproject.toml
    ci: .github/workflows/ci.yml
    sdk: src/openai_sdk_helpers
    cli: src/openai_sdk_helpers/cli.py
    schemas: schemas/ai-native-platform.schema.json
    plugin_manifest: plugins/openai-sdk-helpers/.codex-plugin/plugin.json
    plugin_tests: tests
    docs: docs
    examples: examples
    security_workflow: .github/workflows/security.yml
    env_example: plugins/openai-sdk-helpers/.env.example
    gitignore: .gitignore
    self_improvement_workflow: .github/workflows/ai-self-improvement.yml
    improvement_issue_template: .github/ISSUE_TEMPLATE/ai-improvement.yml
